<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkedIn Job Scraper</title>
  <style>
    :root {
      --blue:       #0077B5;
      --blue-dark:  #004f7c;
      --blue-light: #e8f4fd;
      --green:      #057642;
      --green-dark: #045c32;
      --red:        #c0392b;
      --orange:     #d97706;
      --gray:       #6b7280;
      --bg:         #f3f2ef;
      --card:       #ffffff;
      --border:     #dde0e4;
      --text:       #1d2226;
      --muted:      #5f6b76;
      --radius:     10px;
      --shadow:     0 1px 4px rgba(0,0,0,.1), 0 2px 8px rgba(0,0,0,.06);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--blue);
      color: #fff;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header svg { width: 26px; height: 26px; fill: #fff; flex-shrink: 0; }
    header h1  { font-size: 19px; font-weight: 700; }
    header p   { font-size: 12px; opacity: .75; margin-left: auto; }

    /* ── Layout ── */
    main {
      max-width: 1260px;
      margin: 0 auto;
      padding: 24px 20px;
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 22px;
      align-items: start;
    }
    @media (max-width: 880px) { main { grid-template-columns: 1fr; } }

    /* ── Card ── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .card-title {
      padding: 13px 20px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }
    .card-title svg { color: var(--blue); }
    .card-body { padding: 18px 20px; }

    /* ── Form fields ── */
    .field { margin-bottom: 13px; }
    .field label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .required { color: var(--red); }
    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 8px 11px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color .18s, box-shadow .18s;
    }
    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(0,119,181,.14);
    }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* ── Language chips ── */
    .lang-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 4px;
    }
    .lang-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 20px;
      cursor: pointer;
      font-size: 12.5px;
      transition: all .15s;
      user-select: none;
    }
    .lang-chip:hover { border-color: var(--blue); background: var(--blue-light); }
    .lang-chip input[type="checkbox"] { accent-color: var(--blue); }

    /* ── Format radio ── */
    .radio-row { display: flex; gap: 10px; margin-top: 4px; }
    .radio-opt {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13.5px;
      transition: all .15s;
    }
    .radio-opt:has(input:checked) {
      border-color: var(--blue);
      background: var(--blue-light);
      color: var(--blue);
      font-weight: 600;
    }
    .radio-opt input { accent-color: var(--blue); }

    /* ── Toggle ── */
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0 4px;
      font-size: 13.5px;
    }
    .toggle { position: relative; width: 38px; height: 21px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #c5cdd5;
      border-radius: 21px;
      cursor: pointer;
      transition: background .2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 15px; height: 15px;
      left: 3px; bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform .2s;
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }
    .toggle input:checked + .slider { background: var(--blue); }
    .toggle input:checked + .slider::before { transform: translateX(17px); }

    /* ── Divider ── */
    .divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

    /* ── Submit button ── */
    .btn-scrape {
      width: 100%;
      padding: 11px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .2s;
      margin-top: 6px;
    }
    .btn-scrape:hover:not(:disabled) { background: var(--blue-dark); }
    .btn-scrape:disabled { background: #9cb8d0; cursor: not-allowed; }

    /* ── Status bar ── */
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #f8f9fa;
      border-bottom: 1px solid var(--border);
      font-size: 12.5px;
      color: var(--muted);
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #c5cdd5; flex-shrink: 0;
      transition: background .3s;
    }
    .dot.running { background: #f59e0b; animation: blink 1.1s ease-in-out infinite; }
    .dot.done    { background: var(--green); }
    .dot.error   { background: var(--red); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

    /* ── Terminal console ── */
    .console {
      background: #161b22;
      color: #c9d1d9;
      font-family: "Cascadia Code","Fira Code","Consolas","Menlo",monospace;
      font-size: 12.5px;
      line-height: 1.75;
      padding: 14px 16px;
      min-height: 400px;
      max-height: 500px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .console .l-scrape  { color: #8b949e; }
    .console .l-kept    { color: #3fb950; }
    .console .l-filter  { color: #f85149; }
    .console .l-warn    { color: #d29922; }
    .console .l-error   { color: #f85149; font-weight: 700; }
    .console .l-save    { color: #58a6ff; }
    .console .l-info    { color: #79c0ff; }
    .console .l-done    { color: #3fb950; font-weight: 700; }
    .console .placeholder { color: #484f58; font-style: italic; }

    /* ── Results panel ── */
    .results-panel {
      border-top: 1px solid var(--border);
      padding: 16px 20px;
      display: none;
    }
    .results-panel.show { display: block; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat {
      text-align: center;
      padding: 10px 6px;
      border-radius: 8px;
      background: #f4f5f7;
    }
    .stat .n { font-size: 26px; font-weight: 800; line-height: 1.1; }
    .stat .l { font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-top: 2px; }
    .stat.s-scraped .n { color: var(--blue); }
    .stat.s-kept    .n { color: var(--green); }
    .stat.s-filtered .n { color: var(--red); }

    .btn-dl {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: var(--green);
      color: #fff;
      text-decoration: none;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 700;
      transition: background .2s;
    }
    .btn-dl:hover { background: var(--green-dark); }

    .note {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    /* ── Error box ── */
    .err-box {
      margin: 14px 20px;
      padding: 12px 16px;
      background: #fff5f5;
      border: 1px solid #fecdd3;
      border-radius: 7px;
      color: var(--red);
      font-size: 13.5px;
      display: none;
    }
    .err-box.show { display: block; }

    /* ── Spinner ── */
    .spin { animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- ── Header ─────────────────────────────────────────────────────────────── -->
<header>
  <svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
  <h1>LinkedIn Job Scraper</h1>
  <p>linkedin-jobs-scraper · franc · exceljs</p>
</header>

<!-- ── Main grid ──────────────────────────────────────────────────────────── -->
<main>

  <!-- ── Left: form ── -->
  <div class="card">
    <div class="card-title">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      Search Parameters
    </div>
    <div class="card-body">
      <form id="form">

        <div class="row2">
          <div class="field">
            <label>Query <span class="required">*</span></label>
            <input id="query" type="text" placeholder="Software Engineer" required />
          </div>
          <div class="field">
            <label>Location</label>
            <input id="location" type="text" placeholder="Amsterdam, NL" />
          </div>
        </div>

        <div class="row2">
          <div class="field">
            <label>Limit</label>
            <input id="limit" type="number" value="50" min="1" max="500" />
          </div>
          <div class="field">
            <label>Date Posted</label>
            <select id="dateSincePosted">
              <option value="">Any time</option>
              <option value="past24hours">Past 24 hours</option>
              <option value="pastWeek">Past week</option>
              <option value="pastMonth">Past month</option>
            </select>
          </div>
        </div>

        <div class="row2">
          <div class="field">
            <label>Experience Level</label>
            <select id="experienceLevel">
              <option value="">Any</option>
              <option value="internship">Internship</option>
              <option value="entryLevel">Entry Level</option>
              <option value="associate">Associate</option>
              <option value="senior">Senior</option>
              <option value="director">Director</option>
              <option value="executive">Executive</option>
            </select>
          </div>
          <div class="field">
            <label>Job Type</label>
            <select id="jobType">
              <option value="">Any</option>
              <option value="fullTime">Full-time</option>
              <option value="partTime">Part-time</option>
              <option value="contract">Contract</option>
              <option value="temporary">Temporary</option>
              <option value="internship">Internship</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>Remote Arrangement</label>
          <select id="remoteFilter">
            <option value="">Any</option>
            <option value="remote">Remote</option>
            <option value="onSite">On-site</option>
            <option value="hybrid">Hybrid</option>
          </select>
        </div>

        <div class="field">
          <label>Allowed Languages</label>
          <div class="lang-grid">
            <label class="lang-chip"><input type="checkbox" name="lang" value="eng" checked /> English</label>
            <label class="lang-chip"><input type="checkbox" name="lang" value="nld" /> Dutch</label>
            <label class="lang-chip"><input type="checkbox" name="lang" value="deu" /> German</label>
            <label class="lang-chip"><input type="checkbox" name="lang" value="fra" /> French</label>
            <label class="lang-chip"><input type="checkbox" name="lang" value="spa" /> Spanish</label>
            <label class="lang-chip"><input type="checkbox" name="lang" value="ita" /> Italian</label>
            <label class="lang-chip"><input type="checkbox" name="lang" value="por" /> Portuguese</label>
            <label class="lang-chip"><input type="checkbox" name="lang" value="swe" /> Swedish</label>
          </div>
        </div>

        <hr class="divider" />

        <div class="field">
          <label>Output Format</label>
          <div class="radio-row">
            <label class="radio-opt"><input type="radio" name="fmt" value="excel" checked /> 📊 Excel (.xlsx)</label>
            <label class="radio-opt"><input type="radio" name="fmt" value="csv" /> 📄 CSV (.csv)</label>
          </div>
        </div>

        <div class="field">
          <label>Output filename <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)">(optional, no extension)</span></label>
          <input id="outputPath" type="text" placeholder="my_search (auto-generated if blank)" />
        </div>

        <div class="toggle-row">
          <label class="toggle">
            <input type="checkbox" id="dryRun" />
            <span class="slider"></span>
          </label>
          <span>Dry run &nbsp;<span style="color:var(--muted);font-size:12.5px">— detect languages, skip file export</span></span>
        </div>

        <button type="submit" class="btn-scrape" id="submitBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          Start Scraping
        </button>

      </form>
    </div>
  </div>

  <!-- ── Right: console + results ── -->
  <div class="card" id="rightCard">
    <div class="card-title">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      Live Output
      <div class="status-row" style="margin-left:auto;padding:0;background:none;border:none;">
        <div class="dot" id="dot"></div>
        <span id="statusTxt">Ready</span>
      </div>
    </div>

    <div class="console" id="console">
      <span class="placeholder">Output will appear here once you click "Start Scraping"…</span>
    </div>

    <!-- results -->
    <div class="results-panel" id="resultsPanel">
      <div class="stats">
        <div class="stat s-scraped"><div class="n" id="sScraped">0</div><div class="l">Scraped</div></div>
        <div class="stat s-kept">   <div class="n" id="sKept">0</div>   <div class="l">Kept</div></div>
        <div class="stat s-filtered"><div class="n" id="sFiltered">0</div><div class="l">Filtered</div></div>
      </div>
      <a id="dlBtn" class="btn-dl" href="#" style="display:none">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span id="dlLabel">Download</span>
      </a>
      <p class="note" id="note"></p>
    </div>

    <div class="err-box" id="errBox"></div>
  </div>

</main>

<script>
  const form       = document.getElementById('form');
  const submitBtn  = document.getElementById('submitBtn');
  const consoleEl  = document.getElementById('console');
  const dot        = document.getElementById('dot');
  const statusTxt  = document.getElementById('statusTxt');
  const resultsPanel = document.getElementById('resultsPanel');
  const errBox     = document.getElementById('errBox');

  let es = null; // EventSource

  function setStatus(state, text) {
    dot.className = 'dot ' + state;
    statusTxt.textContent = text;
  }

  function appendLog(msg) {
    if (consoleEl.querySelector('.placeholder')) consoleEl.innerHTML = '';
    const el = document.createElement('div');
    if      (msg.includes('✅')) el.className = 'l-kept';
    else if (msg.includes('🚫')) el.className = 'l-filter';
    else if (msg.includes('❌')) el.className = 'l-error';
    else if (msg.includes('⚠️')) el.className = 'l-warn';
    else if (msg.includes('💾')) el.className = 'l-save';
    else if (msg.includes('📥')) el.className = 'l-scrape';
    else if (msg.includes('📊') || msg.includes('🌐') || msg.includes('🔍') || msg.includes('📋') || msg.includes('📏')) el.className = 'l-info';
    else if (msg.includes('🔒') || msg.includes('📡')) el.className = 'l-scrape';
    else el.className = 'l-info';
    el.textContent = msg;
    consoleEl.appendChild(el);
    consoleEl.scrollTop = consoleEl.scrollHeight;
  }

  function resetBtn() {
    submitBtn.disabled = false;
    submitBtn.innerHTML = `
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      Start Scraping`;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (es) { es.close(); es = null; }

    // Reset
    consoleEl.innerHTML = '<span class="placeholder">Connecting to scraper…</span>';
    resultsPanel.classList.remove('show');
    errBox.classList.remove('show');
    errBox.textContent = '';
    document.getElementById('dlBtn').style.display = 'none';
    document.getElementById('note').textContent = '';

    submitBtn.disabled = true;
    submitBtn.innerHTML = `
      <svg class="spin" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
      Scraping…`;
    setStatus('running', 'Running…');

    const langs = [...document.querySelectorAll('input[name="lang"]:checked')].map(c => c.value);
    const fmt   = document.querySelector('input[name="fmt"]:checked').value;

    const payload = {
      query:            document.getElementById('query').value.trim(),
      location:         document.getElementById('location').value.trim() || undefined,
      limit:            parseInt(document.getElementById('limit').value) || 50,
      dateSincePosted:  document.getElementById('dateSincePosted').value  || undefined,
      experienceLevel:  document.getElementById('experienceLevel').value  || undefined,
      jobType:          document.getElementById('jobType').value          || undefined,
      remoteFilter:     document.getElementById('remoteFilter').value     || undefined,
      allowedLanguages: langs.length ? langs : ['eng'],
      outputFormat:     fmt,
      outputPath:       document.getElementById('outputPath').value.trim() || undefined,
      dryRun:           document.getElementById('dryRun').checked,
    };

    let jobId;
    try {
      const r = await fetch('/api/scrape', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Server error');
      jobId = d.jobId;
    } catch (err) {
      setStatus('error', 'Failed');
      errBox.textContent = '❌ ' + err.message;
      errBox.classList.add('show');
      resetBtn();
      return;
    }

    es = new EventSource(`/api/events/${jobId}`);

    es.onmessage = (ev) => {
      const data = JSON.parse(ev.data);

      if (data.type === 'log') {
        appendLog(data.message);

      } else if (data.type === 'done') {
        es.close(); es = null;
        setStatus('done', 'Complete');
        resetBtn();

        document.getElementById('sScraped').textContent  = data.totalScraped ?? 0;
        document.getElementById('sKept').textContent     = data.passed       ?? 0;
        document.getElementById('sFiltered').textContent = (data.totalScraped ?? 0) - (data.passed ?? 0);
        resultsPanel.classList.add('show');

        if (data.file && !payload.dryRun) {
          const btn = document.getElementById('dlBtn');
          btn.href  = `/api/download/${encodeURIComponent(data.file)}`;
          document.getElementById('dlLabel').textContent = `Download  ${data.file}`;
          btn.style.display = 'inline-flex';
        } else if (payload.dryRun) {
          document.getElementById('note').textContent = '🔍 Dry-run — no file was written.';
        } else {
          document.getElementById('note').textContent = '⚠️ No jobs passed the language filter — no file written.';
        }

      } else if (data.type === 'error') {
        es.close(); es = null;
        setStatus('error', 'Error');
        resetBtn();
        errBox.textContent = '❌ ' + data.message;
        errBox.classList.add('show');
      }
    };

    es.onerror = () => {
      if (es) { es.close(); es = null; }
      setStatus('error', 'Connection lost');
      resetBtn();
    };
  });
</script>
</body>
</html>
